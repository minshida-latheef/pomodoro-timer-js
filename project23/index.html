<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenPulse | Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="modes">
      <button class="mode-btn active" data-time="25">Focus</button>
      <button class="mode-btn" data-time="5">Short Break</button>
      <button class="mode-btn" data-time="15">Long Break</button>
    </div>

    <div id="timer" class="timer">25:00</div>

    <div class="controls">
      <button id="start-btn" class="primary">Start</button>
      <button id="reset-btn" class="secondary">Reset</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
